<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🥚 Steal Egg 3D — Decor & Magnet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lilita+One&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent; font-family: 'Lilita One', 'Arial Black', sans-serif;}
  body{overflow:hidden;background:#0a1220;user-select:none;touch-action:none}
  canvas{display:block; cursor:grab;}
  canvas:active{cursor:grabbing;}

  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:10;text-shadow: 2px 2px 0 #000;}
  #stats{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column;gap:5px;}
  .stat{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:900;letter-spacing:1px;}
  #coins .val{color:#7dffb0;}
  #dia .val{color:#ffd75e;}

  #topcenter{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;}
  #zonename{padding:8px 24px;font-size:20px;color:#fff;background:rgba(0,0,0,0.5);border:2px solid #555;border-radius:8px;}
  #status{padding:8px 24px;font-size:18px;color:#fff;background:rgba(0,0,0,0.5);border:2px solid #555;border-radius:8px;}
  #status.warn{color:#ff4444;border-color:#ff4444;animation:pulse .4s infinite alternate;}
  @keyframes pulse{from{opacity:.7}to{opacity:1}}

  #speedbar-wrap{position:absolute;bottom:20px;right:20px;width:250px;display:flex;flex-direction:column;gap:5px;}
  #speedbar-label{font-size:14px;color:#fff;}
  #speedbar{width:100%;height:20px;border-radius:10px;background:#222;border:3px solid #555;overflow:hidden;}
  #speedfill{height:100%;width:0%;background:linear-gradient(90deg,#2ec5ff,#7dffb0);transition:width .1s;}

  #minimap{position:fixed;right:12px;top:50%;transform:translateY(-50%);width:20px;height:60vh;background:#222;border:3px solid #555;border-radius:6px;z-index:15;overflow:hidden;padding:2px;}
  #mm-zones{width:100%;height:100%;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;}
  .mm-zone{flex:1;opacity:0.3;position:relative;}
  .mm-zone.unlocked{opacity:1;}
  .mm-zone.active{box-shadow:inset 0 0 10px #fff;}
  #mm-marker{position:absolute;left:-2px;width:24px;height:4px;background:#fff;box-shadow:0 0 6px #fff;transition:top .1s;pointer-events:none;z-index:2;}

  #shop-btn{position:fixed;top:14px;left:14px;padding:12px 24px;font-size:20px;color:#000;background:#7dffb0;border:4px solid #1a5a30;border-radius:12px;cursor:pointer;pointer-events:auto;box-shadow:0 6px 0 #1a5a30;transition:transform .05s;}
  #shop-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1a5a30;}
  
  #topup-btn{position:fixed;top:70px;left:14px;padding:8px 16px;font-size:16px;color:#fff;background:#ff5f6d;border:3px solid #8a1a2a;border-radius:10px;cursor:pointer;pointer-events:auto;box-shadow:0 4px 0 #8a1a2a;}
  #topup-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a1a2a;}

  #interact-prompt{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);border:2px solid #ffd75e;color:#ffd75e;padding:10px 20px;border-radius:10px;font-size:20px;display:none;pointer-events:auto;cursor:pointer;z-index:20;text-align:center;}
  #interact-prompt.show{display:block;}

  #chest-prompt{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(255,215,0,0.15);border:2px solid #ffd700;color:#ffd700;padding:8px 18px;border-radius:10px;font-size:18px;display:none;pointer-events:none;z-index:20;text-align:center;text-shadow:0 0 8px #ffd700;}
  #chest-prompt.show{display:block;animation:chestPulse 0.6s infinite alternate;}
  @keyframes chestPulse{from{opacity:.7;transform:translateX(-50%) scale(0.98);}to{opacity:1;transform:translateX(-50%) scale(1.02);}}

  #shop{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);pointer-events:auto;backdrop-filter:blur(2px);}
  #shop.hidden{display:none;}
  .shop-window{width:900px;max-width:95vw;height:80vh;background:#2a2a35;border:4px solid #111;border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,0.8);overflow:hidden;position:relative;}
  
  .shop-header{background:#7dffb0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #1a5a30;}
  .shop-header h1{font-size:32px;color:#000;text-shadow:none;margin:0;letter-spacing:2px;}
  .close-btn{background:#ff3355;border:3px solid #8a1a2a;color:#fff;font-size:24px;width:44px;height:44px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #8a1a2a;}
  .close-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a1a2a;}

  .shop-tabs{display:flex;background:#111;padding:0 10px;border-bottom:3px solid #444;overflow-x:auto;}
  .tab-btn{flex:1;padding:12px;font-size:18px;color:#888;background:transparent;border:none;cursor:pointer;border-bottom:4px solid transparent;transition:0.2s;white-space:nowrap;}
  .tab-btn.active{color:#fff;border-bottom-color:#7dffb0;background:rgba(125,255,176,0.1);}

  .shop-content{padding:20px;overflow-y:auto;flex:1;display:none;}
  .shop-content.active{display:block;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;}
  
  .card{background:linear-gradient(180deg,#3a8dff,#1e5dc4);border:3px solid #111;border-radius:10px;padding:15px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;}
  .card.pass-card{background:linear-gradient(180deg,#ffa500,#d16900);}
  .card.magnet-card{background:linear-gradient(180deg,#ff5f6d,#c41a2a);}
  .card .title{font-size:20px;color:#fff;margin-bottom:10px;line-height:1.2;}
  .card .desc{font-size:14px;color:#eee;margin-bottom:15px;}
  
  .buy-btn{background:#7dffb0;color:#000;padding:10px;border:3px solid #1a5a30;border-radius:8px;font-size:18px;cursor:pointer;box-shadow:0 4px 0 #1a5a30;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.05s;}
  .buy-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1a5a30;}
  .buy-btn:disabled{background:#888;border-color:#555;box-shadow:0 4px 0 #555;cursor:not-allowed;color:#ccc;}
  .buy-btn .price-icon{width:20px;height:20px;background:#ffd75e;border-radius:50%;border:2px solid #b08a00;}

  .pet-actions { display: flex; gap: 8px; margin-top: 10px; }
  .pet-actions button { flex: 1; padding: 8px; font-size: 14px; }

  #hatch-ui{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);pointer-events:auto;}
  #hatch-ui.hidden{display:none;}
  .hatch-box{background:linear-gradient(180deg,#222,#111);border:4px solid #ffd75e;border-radius:20px;padding:30px;text-align:center;width:600px;max-width:95vw;color:#fff;box-shadow:0 0 50px rgba(255,215,94,0.4);}
  
  .hatch-egg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
  .egg-slot { background: #333; border: 3px solid #555; border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; }
  .egg-slot:hover { border-color: #ffd75e; transform: scale(1.05); }
  .egg-icon { font-size: 60px; }
  .egg-name { font-size: 16px; margin-top: 10px; color: #fff; }

  .hatch-anim-view { display: none; }
  .hatch-anim-view.active { display: block; }
  .egg-list-view.hidden { display: none; }

  .spinning-egg { font-size: 120px; animation: shake 0.5s infinite; display: inline-block; }
  @keyframes shake { 0% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } 100% { transform: rotate(-10deg); } }
  
  .pet-reveal { font-size: 100px; margin-bottom: 15px; display: none; }
  .rarity-text { font-size: 28px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
  
  .r-common { color: #b0b0b0; text-shadow: 0 0 10px #b0b0b0; }
  .r-uncommon { color: #55ff55; text-shadow: 0 0 15px #55ff55; }
  .r-rare { color: #55aaff; text-shadow: 0 0 15px #55aaff; }
  .r-epic { color: #c77dff; text-shadow: 0 0 20px #c77dff; }
  .r-legendary { color: #ffd700; text-shadow: 0 0 25px #ffd700; }
  .r-mythic { color: #ff3333; text-shadow: 0 0 30px #ff3333; }

  #touch-controls{display:none;}
  #touch-controls.visible{display:block;}
  #joystick-zone{position:fixed;bottom:24px;left:24px;width:140px;height:140px;z-index:20;border-radius:50%;background:rgba(255,255,255,0.1);border:3px solid rgba(255,255,255,0.3);pointer-events:auto;touch-action:none;}
  #joystick-knob{position:absolute;top:50%;left:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:#7dffb0;box-shadow:0 4px 10px rgba(0,0,0,0.5);border:3px solid #1a5a30;pointer-events:none;will-change:transform;}
  
  #toast{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) scale(.85);font-size:36px;font-weight:900;text-align:center;opacity:0;transition:all .3s cubic-bezier(.2,1.6,.4,1);color:#fff;text-shadow:0 4px 10px #000;pointer-events:none;padding:0 20px;z-index:50;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #toast.good{color:#7dffb0;}
  #toast.bad{color:#ff4444;}
  #toast.gold{color:#ffd700; text-shadow: 0 0 20px #ffd700;}
  #toast.legendary{color:#ffd700; text-shadow: 0 0 20px #ffd700;}
  #toast.promo{color:#ff44ff; text-shadow: 0 0 25px #ff44ff; font-size:44px;}
</style>
</head>
<body>

<div id="hud">
  <div id="stats">
    <div class="stat" id="coins"><span class="ico">💵</span><span class="val">$0</span></div>
    <div class="stat" id="dia"><span class="ico">💎</span><span class="val">0</span></div>
  </div>

  <div id="topcenter">
    <div id="zonename">Стартовый лес</div>
    <div id="status">Собери сферы ⚡ и укради яйцо</div>
  </div>

  <div id="speedbar-wrap">
    <div id="speedbar-label">SPEED BOOST (Orbs)</div>
    <div id="speedbar"><div id="speedfill"></div></div>
  </div>

  <button id="shop-btn">🛒 SHOP</button>
  <button id="topup-btn">💎 +500 (Donate)</button>
  <div id="interact-prompt">Нажмите E, чтобы открыть Инкубатор</div>
  <div id="chest-prompt">🎁 Сундук рядом — подойди!</div>

  <div id="minimap">
    <div id="mm-zones"></div>

  </div>
</div>

<div id="touch-controls">

</div>

<div id="shop" class="hidden">
  <div class="shop-window">
    <div class="shop-header">
      <h1>SHOP</h1>
      <button class="close-btn" id="shop-close">X</button>
    </div>
    <div class="shop-tabs">
      <button class="tab-btn active" data-tab="speed">SPEED</button>
      <button class="tab-btn" data-tab="magnet">MAGNET</button>
      <button class="tab-btn" data-tab="passes">PASSES</button>
      <button class="tab-btn" data-tab="pets">MY PETS</button>
      <button class="tab-btn" data-tab="zones">ZONES</button>
    </div>
    
    <div class="shop-content active" id="tab-speed">
      <div class="grid" id="speed-grid"></div>
    </div>
    <div class="shop-content" id="tab-magnet">
      <div class="grid" id="magnet-grid"></div>
    </div>
    <div class="shop-content" id="tab-passes">
      <div class="grid" id="passes-grid"></div>
    </div>
    <div class="shop-content" id="tab-pets">
      <div class="grid" id="pets-grid"></div>
    </div>
    <div class="shop-content" id="tab-zones">
      <div class="grid" id="zones-grid"></div>
    </div>
  </div>
</div>

<div id="hatch-ui" class="hidden">
  <div class="hatch-box">
    <div class="egg-list-view" id="egg-list-view">
      <h2 style="color:#ffd75e; font-size:32px; margin-bottom:10px;">ИНКУБАТОР</h2>
      <p style="color:#aaa; margin-bottom:20px;">Выберите украденное яйцо, чтобы вылупить питомца</p>
      <div class="hatch-egg-grid" id="hatch-egg-grid"></div>
      <button class="buy-btn" id="hatch-close-btn" style="width:100%; margin-top:20px; background:#ff3355; border-color:#8a1a2a; box-shadow:0 4px 0 #8a1a2a; color:#fff;">ЗАКРЫТЬ</button>
    </div>

    <div class="hatch-anim-view" id="hatch-anim-view">
      <div class="spinning-egg" id="spinning-egg">🥚</div>
      <div class="pet-reveal" id="pet-reveal">🐶</div>
      
      <div class="rarity-text" id="rarity-text"></div>
      <div class="hatch-title" id="hatch-title" style="font-size:24px; margin-bottom:20px;">Вылупляется...</div>
      
      <button class="buy-btn" id="claim-pet-btn" style="width:100%; font-size:24px; display:none;">ЗАБРАТЬ ПИТОМЦА</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   КОНФИГ И ДАННЫЕ
============================================================ */
const CFG = {

const BIOMES = [
  { name:'Лес',       ground:0x3f7a44, baseCol:0x5fa35a, sky:0x9fd8f0, monsterSpeed:1.2, reward:100, unlockCost:0, eggIcon:'🥚', eggName:'Лесное Яйцо', stealReq: 50 },
  { name:'Лёд',       ground:0xa8d8ea, baseCol:0xd4eefa, sky:0xcfeaf7, monsterSpeed:1.5, reward:500, unlockCost:1000, eggIcon:'🧊', eggName:'Ледяное Яйцо', stealReq: 200 },

  { name:'Тьма',      ground:0x1e2a1e, baseCol:0x2a3a2a, sky:0x2a1f3a, monsterSpeed:2.5, reward:50000, unlockCost:100000, eggIcon:'🌑', eggName:'Тёмное Яйцо', stealReq: 25000 },
  { name:'Кристалл',  ground:0x1a2a3a, baseCol:0x2a3a4a, sky:0x0a1a2a, monsterSpeed:2.8, reward:250000, unlockCost:500000, eggIcon:'💎', eggName:'Кристальное Яйцо', stealReq: 100000 },
  { name:'Руины',     ground:0x4a4540, baseCol:0x5a5550, sky:0x6a6570, monsterSpeed:3.2, reward:1000000, unlockCost:2000000, eggIcon:'🏛️', eggName:'Древнее Яйцо', stealReq: 500000 },
  { name:'Космос',    ground:0x0a0a1a, baseCol:0x1a1a2a, sky:0x05050a, monsterSpeed:4.0, reward:5000000, unlockCost:10000000, eggIcon:'🌌', eggName:'Космическое Яйцо', stealReq: 2000000 }
];

const SPEED_UPGRADES = [
  { name: 'x2 SPEED', mult: 2.0, cost: 10, icon: '👟' },
  { name: 'x5 SPEED', mult: 5.0, cost: 30, icon: '👟' },
  { name: 'x10 SPEED', mult: 10.0, cost: 80, icon: '👟' },
  { name: 'x25 SPEED', mult: 25.0, cost: 150, icon: '👟' },
  { name: 'x50 SPEED', mult: 50.0, cost: 400, icon: '👟' },
  { name: 'x100 SPEED', mult: 100.0, cost: 1000, icon: '🏆' }
];

const MAGNET_UPGRADES = [
  { name: 'Магнит I',   radius: 5,  cost: 20, icon: '🧲' },
  { name: 'Магнит II',  radius: 8,  cost: 60, icon: '🧲' },
  { name: 'Магнит III', radius: 12, cost: 150, icon: '🧲' },
  { name: 'Магнит IV',  radius: 18, cost: 350, icon: '🧲' },
  { name: 'Магнит V',   radius: 25, cost: 800, icon: '🧲' },
  { name: 'Магнит MAX', radius: 40, cost: 1500, icon: '🌪️' }
];

const PASSES = [
  { name: 'x2 Money', desc: 'Get x2 Money!', cost: 289, mult: 2, id: 'money' },
  { name: 'x2 Growth', desc: 'Eggs Grow x2 faster!', cost: 340, mult: 2, id: 'speed' }
];

const PET_DB = {
  0: {
    common:    [{id:'sq', n:'Белка', i:'🐿️', sp:1.1, mn:1.0}, {id:'frog', n:'Жаба', i:'🐸', sp:1.0, mn:1.1}],
    uncommon:  [{id:'rabb', n:'Кролик', i:'🐰', sp:1.3, mn:1.2}],
    rare:      [{id:'deer', n:'Олень', i:'🦌', sp:1.5, mn:1.5}],
    epic:      [{id:'wolf', n:'Волк', i:'🐺', sp:1.8, mn:1.8}],
    legendary: [{id:'bear', n:'Медведь', i:'🐻', sp:2.5, mn:2.5}]
  },
  1: {
    common:    [{id:'peng', n:'Пингвин', i:'🐧', sp:1.2, mn:1.1}],
    uncommon:  [{id:'seal', n:'Тюлень', i:'🦭', sp:1.4, mn:1.3}],
    rare:      [{id:'polar', n:'Белый Медведь', i:'🐻‍❄️', sp:1.7, mn:1.7}],
    epic:      [{id:'yeti', n:'Йети', i:'🦍', sp:2.2, mn:2.0}],
    legendary: [{id:'icedrag', n:'Ледяной Дракон', i:'🐉', sp:3.0, mn:3.0}]
  },
  2: {
    common:    [{id:'liz', n:'Ящерица', i:'🦎', sp:1.3, mn:1.3}],

    common:    [{id:'camel', n:'Верблюд', i:'🐪', sp:1.4, mn:1.4}],

    rare:      [{id:'sphinx', n:'Сфинкс', i:'🦁', sp:2.5, mn:2.5}],
    epic:      [{id:'anubis', n:'Анубис', i:'🐕', sp:3.5, mn:3.5}],

  }

/* ============================================================
   СОСТОЯНИЕ
============================================================ */
let coins = 5000;
let diamonds = 500;
let speedLevel = 0;
let magnetLevel = 0;
let hasX2Money = false;
let hasX2Speed = false;
let unlocked = BIOMES.map((_, i) => i === 0);
let carrying = false;
let activeChase = null;

let eggInventory = {};
let myPets = []; 
let equippedPetId = null;

let promoSpeedMult = 1;
let promoUsed = false;

let treadmillSpeedStat = 0;
let speedBonus = 0;

function fmt(num) {
  if(num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
  if(num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
  if(num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
  return Math.floor(num).toString();
}

/* ============================================================
   СЦЕНА
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(BIOMES[0].sky);
scene.fog = new THREE.Fog(BIOMES[0].sky, 130, 340);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 900);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50, 90, 40);
scene.add(sun);

const world = new THREE.Group();
scene.add(world);

const matCache = new Map();
function mat(color, opts={}) {
  const key = color + JSON.stringify(opts);
  if(matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshLambertMaterial({color, ...opts});
  matCache.set(key, m);
  return m;
}
function basicMat(color, opts={}) { return new THREE.MeshBasicMaterial({color, ...opts}); }

/* ============================================================
   ХЕЛПЕР: 3D TEXT SPRITE
============================================================ */
function makeTextSprite(text, color, size = 88) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 1024, 256);
  ctx.font = `bold ${size}px "Lilita One", "Arial Black", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 16;
  ctx.strokeStyle = '#000000';
  ctx.strokeText(text, 512, 128);
  ctx.fillStyle = color;
  ctx.fillText(text, 512, 128);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
}

function baseRange(i) {
  const zTop = CFG.Z_TOP - i*(CFG.L_BASE + CFG.L_BIOME);
  return { zTop, zBottom: zTop - CFG.L_BASE };
}
function biomeRange(i) {
  const zTop = CFG.Z_TOP - CFG.L_BASE - i*(CFG.L_BASE + CFG.L_BIOME);
  return { zTop, zBottom: zTop - CFG.L_BIOME };
}
function baseAt(z) {
  for(let i=0;i<BIOMES.length;i++){ const b=baseRange(i); if(z<=b.zTop && z>=b.zBottom) return i; }
  return -1;
}
function biomeAt(z) {
  for(let i=0;i<BIOMES.length;i++){ const b=biomeRange(i); if(z<=b.zTop && z>=b.zBottom) return i; }
  return -1;
}

function buildBiomeDecor(i) {
  const bio = biomeRange(i);
  const def = BIOMES[i];
  const count = 20;
  const decorGroup = new THREE.Group();
  world.add(decorGroup);

  for(let j=0; j<count; j++) {
    let x = -CFG.PATH_HALF - 4 - Math.random() * 15;
    if(Math.random() > 0.5) x = CFG.PATH_HALF + 4 + Math.random() * 15;
    const z = bio.zBottom + 2 + Math.random() * (CFG.L_BIOME - 4);
    
    let mesh = null;
    if(i === 0) { // Лес - Елки
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 6), mat(0x5c3a21));
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 7), mat(0x2d5a27));
      leaves.position.y = 2;
      mesh = new THREE.Group(); mesh.add(trunk); mesh.add(leaves);
    } else if(i === 1) { // Лёд - Кристаллы
      mesh = new THREE.Mesh(new THREE.ConeGeometry(0.8, 3.5, 5), mat(0x88ccff, {emissive:0x224466}));
      mesh.rotation.z = (Math.random() - 0.5) * 0.5;
    } else if(i === 2) { // Вулкан - Камни
      mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2, 0), mat(0x222222, {emissive:0x441100}));
    } else if(i === 3) { // Пустыня - Кактусы
      const c1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 2.5, 6), mat(0x4a7a3a));
      const c2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1, 6), mat(0x4a7a3a));
      c2.position.set(0.5, 0, 0); c2.rotation.z = Math.PI/4;
      mesh = new THREE.Group(); mesh.add(c1); mesh.add(c2);
    } else if(i === 4) { // Тьма - Деревья
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 5), mat(0x111111));
      mesh = new THREE.Group(); mesh.add(trunk);
    } else if(i === 5) { // Кристалл - Октаэдры
      mesh = new THREE.Mesh(new THREE.OctahedronGeometry(1.5, 0), mat(0x00ffff, {transparent:true, opacity:0.8}));
      mesh.position.y = 1.5;
    } else if(i === 6) { // Руины - Колонны
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 4, 8), mat(0x888888));
      mesh.rotation.z = (Math.random() - 0.5) * 0.3;
    } else if(i === 7) { // Космос - Астероиды
      mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), mat(0x333344));
      mesh.position.y = Math.random() * 4;
      mesh.rotation.set(Math.random(), Math.random(), Math.random());
    }

    if(mesh) {
      mesh.position.set(x, mesh.position.y || 0, z);
      if(i === 0 || i === 3 || i === 4) mesh.position.y = 0; // Для групп ставим на землю
      else mesh.position.y = mesh.position.y || 0.5;
      decorGroup.add(mesh);
    }
  }
}

  boxMesh.position.y = 0.65;

  lid.position.set(0, 0.225, 0.7);
  lidPivot.add(lid);

  const lock = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.55, 0.15), goldMat);
  lock.position.set(0, 1.0, 0.76);

  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

function randomChestPos(biomeIdx) {
  const bio = biomeRange(biomeIdx);
  const nestZ = bio.zBottom + 9;
  for(let attempt = 0; attempt < 25; attempt++) {
    const z = bio.zBottom + 4 + Math.random() * (bio.zTop - bio.zBottom - 8);
    const x = -CFG.PATH_HALF + 3 + Math.random() * (CFG.PATH_HALF * 2 - 6);
    if(Math.hypot(x, z - nestZ) < 5) continue;
    return { x, z };
  }
  return { x: 0, z: bio.zBottom + 15 };
}

function initSingleChest() {
  const pos = randomChestPos(0);

  mesh.position.set(pos.x, 0, pos.z);

  globalChest = { mesh, biomeIdx: 0, active: true, lifeTimer: CFG.CHEST_LIFETIME, respawnTimer: 0, animTime: Math.random() * 10, opening: false, openTime: 0 };
}

function giveChestReward(biomeIdx) {
  const biome = BIOMES[biomeIdx];
  const roll = Math.random() * 100;
  const mm = getMoneyMult();

  if(roll < 55) {
    const amt = Math.floor(biome.reward * (0.8 + Math.random() * 1.7) * mm);
    coins += amt;
    showToast(`🎁 +$${fmt(amt)}`, 'gold');
  } else if(roll < 78) {
    const amt = Math.floor((10 + Math.random() * 20) * (1 + biomeIdx * 0.6));
    diamonds += amt;
    showToast(`🎁 +${amt} 💎`, 'good');
  } else if(roll < 90) {
    speedBonus = Math.min(CFG.MAX_ORB_BONUS, speedBonus + CFG.ORB_BONUS * 3);
    showToast(`🎁 ⚡ +10% SPEED BOOST!`, 'good');
  } else if(roll < 97) {
    eggInventory[biomeIdx] = (eggInventory[biomeIdx] || 0) + 1;
    showToast(`🎁 ${biome.eggIcon} +1 ${biome.eggName}!`, 'gold');
  } else {
    const rarities = ['rare', 'epic', 'legendary'];
    const rarity = rarities[Math.floor(Math.random() * rarities.length)];
    let pool = PET_DB[biomeIdx] ? PET_DB[biomeIdx][rarity] : null;
    if(!pool) pool = PET_DB[3][rarity] || PET_DB[0][rarity];
    const pet = pool[Math.floor(Math.random() * pool.length)];
    myPets.push({...pet, rarity, biome: biomeIdx});
    showToast(`🎁 ${pet.i} ${pet.n} (${rarity.toUpperCase()})!`, 'legendary');
    if(!equippedPetId) {
      equippedPetId = pet.id;
      updatePetFollower();
    }
    if(shopOpen) renderUI();
  }
  updateHUD();
}

function updateChests(dt) {
  if(!globalChest) return;
  const chest = globalChest;

  if(chest.opening) {
    chest.openTime += dt;
    const t = Math.min(chest.openTime * 3, 1);
    chest.mesh.userData.lidPivot.rotation.x = -t * 1.6;
    const s = 1 + t * 0.9;
    chest.mesh.userData.body.scale.set(s, s, s);
    chest.mesh.userData.body.position.y = t * 2;
    chest.mesh.userData.ring.material.opacity = 0.5 * (1 - t);
    chest.mesh.userData.ring.scale.set(1 + t * 2, 1 + t * 2, 1);
    if(chest.mesh.userData.glow) chest.mesh.userData.glow.intensity = 0.6 * (1 - t);

    if(chest.openTime > 0.7) {
      chest.mesh.visible = false;
      chest.opening = false;
      chest.active = false;
      chest.respawnTimer = CFG.CHEST_RESPAWN;
    }
    return;
  }

  if(!chest.active) {
    chest.respawnTimer -= dt;
    if(chest.respawnTimer <= 0) {
      const availableBiomes = unlocked.map((u, i) => u ? i : -1).filter(i => i !== -1);
      const randomBiome = availableBiomes[Math.floor(Math.random() * availableBiomes.length)];
      const pos = randomChestPos(randomBiome);
      chest.mesh.position.set(pos.x, 0, pos.z);
      chest.mesh.visible = true;
      chest.mesh.userData.body.position.y = 0;
      chest.mesh.userData.body.scale.set(1, 1, 1);
      chest.mesh.userData.body.rotation.y = 0;
      chest.mesh.userData.lidPivot.rotation.x = 0;
      chest.mesh.userData.ring.scale.set(1, 1, 1);
      chest.mesh.userData.ring.material.opacity = 0.5;
      if(chest.mesh.userData.glow) chest.mesh.userData.glow.intensity = 0.6;
      chest.active = true;
      chest.lifeTimer = CFG.CHEST_LIFETIME;
      chest.animTime = 0;
      chest.biomeIdx = randomBiome;
    }
    return;
  }

  chest.animTime += dt;
  chest.mesh.userData.body.position.y = Math.sin(chest.animTime * 2) * 0.15 + 0.1;
  chest.mesh.userData.body.rotation.y = chest.animTime * 0.8;
  const pulse = 1 + Math.sin(chest.animTime * 3) * 0.15;
  chest.mesh.userData.ring.scale.set(pulse, pulse, 1);
  chest.mesh.userData.ring.material.opacity = 0.3 + Math.sin(chest.animTime * 3) * 0.15;
  if(chest.mesh.userData.glow) chest.mesh.userData.glow.intensity = 0.5 + Math.sin(chest.animTime * 4) * 0.3;

  chest.lifeTimer -= dt;
  if(chest.lifeTimer <= 0) {
    chest.active = false; chest.mesh.visible = false; chest.respawnTimer = CFG.CHEST_RESPAWN;
    return;
  }

  const d = Math.hypot(player.position.x - chest.mesh.position.x, player.position.z - chest.mesh.position.z);
  if(d < CFG.CHEST_RADIUS) {
    chest.opening = true; chest.openTime = 0;
    giveChestReward(chest.biomeIdx);
  } else if(d < 7) {
    document.getElementById('chest-prompt').classList.add('show');
  } else {
    document.getElementById('chest-prompt').classList.remove('show');
  }
}

   ЧАСТИЦЫ (Атмосфера)
============================================================ */
let ambientParticles;
let particleVelocities = [];
function initAmbientParticles() {
  const count = 300;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  for(let i=0; i<count; i++) {
    positions[i*3] = (Math.random() - 0.5) * 100;
    positions[i*3+1] = Math.random() * 30;
    positions[i*3+2] = (Math.random() - 0.5) * 200 - 100;
    particleVelocities.push({ x: (Math.random()-0.5)*0.5, y: -0.5 - Math.random()*1.5, z: (Math.random()-0.5)*0.5 });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.6 });
  ambientParticles = new THREE.Points(geo, mat);
  scene.add(ambientParticles);
}

function updateParticles(dt) {
  if(!ambientParticles) return;
  const positions = ambientParticles.geometry.attributes.position.array;
  for(let i=0; i<300; i++) {
    positions[i*3] += particleVelocities[i].x * dt;
    positions[i*3+1] += particleVelocities[i].y * dt;
    positions[i*3+2] += particleVelocities[i].z * dt;

    // Если частица упала слишком низко, поднимаем её наверх
    if(positions[i*3+1] < -2) {
      positions[i*3+1] = 30;
      positions[i*3] = player.position.x + (Math.random() - 0.5) * 80;
      positions[i*3+2] = player.position.z + (Math.random() - 0.5) * 80;
    }
  }
  ambientParticles.geometry.attributes.position.needsUpdate = true;
}

const trailPool = [];
const trailGeo = new THREE.SphereGeometry(0.3, 4, 4);
let trailSpawnTimer = 0;

function spawnTrail(x, y, z, colorHex) {
  let p = trailPool.find(t => !t.active);
  if(!p) {
    p = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({ transparent: true }));
    trailPool.push(p);
    scene.add(p);
  }
  p.material.color.setHex(colorHex);
  p.position.set(x, y, z);
  p.scale.set(1,1,1);
  p.material.opacity = 1.0;
  p.active = true;
  p.life = 0.6;
  p.visible = true;
}

function updateTrails(dt) {
  for(let p of trailPool) {
    if(p.active) {
      p.life -= dt;
      if(p.life <= 0) {
        p.active = false;
        p.visible = false;
      } else {
        p.material.opacity = p.life / 0.6;
        p.scale.setScalar(p.life / 0.6);
      }
    }
  }
}

let camYaw = 0, camPitch = 0.35, camDist = 22;
const camPos = new THREE.Vector3();
let isDragging = false;
renderer.domElement.addEventListener('mousedown', () => isDragging = true);
addEventListener('mouseup', () => isDragging = false);
addEventListener('mousemove', e => {
  if(isDragging){

  }

let joyX = 0, joyY = 0;
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');
let joyActive = false, joyCenterX = 0, joyCenterY = 0;
const JOY_RADIUS = 50;
const isTouch = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
if(isTouch) document.getElementById('touch-controls').classList.add('visible');

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = joystickZone.getBoundingClientRect();
  joyCenterX = rect.left + rect.width/2;
  joyCenterY = rect.top + rect.height/2;
  joyActive = true; moveJoy(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});
joystickZone.addEventListener('touchmove', e => {
  e.preventDefault(); if(joyActive) moveJoy(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});
joystickZone.addEventListener('touchend', e => {
  e.preventDefault(); joyActive = false; joyX = 0; joyY = 0;
  joystickKnob.style.transform = 'translate(0,0)';
}, {passive:false});

function moveJoy(cx, cy){
  let dx = cx - joyCenterX, dy = cy - joyCenterY;
  const dist = Math.hypot(dx, dy);
  if(dist > JOY_RADIUS){ dx = dx/dist * JOY_RADIUS; dy = dy/dist * JOY_RADIUS; }
  joyX = dx / JOY_RADIUS; joyY = dy / JOY_RADIUS;
  joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}

let camTouchId = null, lastTouchX = 0, lastTouchY = 0;
document.body.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  if(t.clientX > window.innerWidth / 2 && camTouchId === null){
    camTouchId = t.identifier; lastTouchX = t.clientX; lastTouchY = t.clientY;
  }
}, {passive:false});
document.body.addEventListener('touchmove', e => {
  for(let i=0; i<e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(t.identifier === camTouchId){
      camYaw -= (t.clientX - lastTouchX) * 0.01;
      camPitch = Math.max(-0.2, Math.min(1.0, camPitch + (t.clientY - lastTouchY) * 0.01));
      lastTouchX = t.clientX; lastTouchY = t.clientY;
    }
  }
}, {passive:false});
document.body.addEventListener('touchend', e => {
  for(let i=0; i<e.changedTouches.length; i++){
    if(e.changedTouches[i].identifier === camTouchId) camTouchId = null;
  }
}, {passive:false});

function getDisplaySpeed(){
  let base = CFG.BASE_SPEED_STAT + treadmillSpeedStat;
  if(speedLevel > 0) base *= SPEED_UPGRADES[speedLevel-1].mult;
  if(hasX2Speed) base *= 2;
  if(equippedPetId) {
    let p = null;
    for(let b in PET_DB) for(let r in PET_DB[b]) p = p || PET_DB[b][r].find(x => x.id === equippedPetId);
    if(p) base *= p.sp;
  }
  return base * (1 + speedBonus) * promoSpeedMult;
}

function getMovementSpeed(){
  const stat = getDisplaySpeed();
  return 4.5 + Math.log10(Math.max(10, stat)) * 3;
}

function getMoneyMult(){
  let mult = 1;
  if(hasX2Money) mult *= 2;
  if(equippedPetId) {
    let p = null;
    for(let b in PET_DB) for(let r in PET_DB[b]) p = p || PET_DB[b][r].find(x => x.id === equippedPetId);
    if(p) mult *= p.mn;
  }
  return mult;
}

function startHatch(biomeIndex) {
  if(isHatching || eggInventory[biomeIndex] <= 0) return;
  isHatching = true;
  currentHatchBiome = biomeIndex;
  eggInventory[biomeIndex]--;
  
  eggListView.classList.add('hidden');

  setTimeout(() => {
    spinEgg.style.display = 'none';

    let rarity = 'common';
    if(roll > 99) rarity = 'legendary';
    else if(roll > 95) rarity = 'epic';
    else if(roll > 85) rarity = 'rare';
    else if(roll > 60) rarity = 'uncommon';
    
    let pool = PET_DB[biomeIndex] ? PET_DB[biomeIndex][rarity] : null;
    if(!pool) pool = PET_DB[3][rarity] || PET_DB[0][rarity];
    
    const pet = pool[Math.floor(Math.random() * pool.length)];
    
    myPets.push({...pet, rarity, biome: biomeIndex});
    if(!equippedPetId) {
      equippedPetId = pet.id;

    title.style.color = '#fff';

      hatchUI.classList.add('hidden');

============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let treadmillAlertTimer = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  
  if(!shopOpen && hatchUI.classList.contains('hidden')) update(dt);
  else elapsed += dt;

  updateTrails(dt);
  updateParticles(dt); // ОБНОВЛЕНИЕ ЧАСТИЦ
  renderer.render(scene, camera);
}

function update(dt){
  elapsed += dt;

  let ix = 0, iz = 0;
  if(keys.w) iz += 1;
  if(keys.s) iz -= 1;
  if(keys.a) ix -= 1;
  if(keys.d) ix += 1;
  if(Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1){ ix += joyX; iz -= joyY; }

  const moving = (Math.abs(ix) > 0.01 || Math.abs(iz) > 0.01);
  const spd = getMovementSpeed();
  
  if(moving){
    const len = Math.hypot(ix, iz); ix /= len; iz /= len;
    const sin = Math.sin(camYaw), cos = Math.cos(camYaw);
    const worldX = ix * cos + iz * -sin;
    const worldZ = ix * -sin + iz * -cos;

    player.position.x += worldX * spd * dt;
    player.position.z += worldZ * spd * dt;

    const targetAngle = Math.atan2(worldX, worldZ);
    let diff = targetAngle - player.rotation.y;
    while(diff > Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    player.rotation.y += diff * 10 * dt;

    const swing = Math.sin(elapsed * 15) * 0.6;
    player.userData.legs[0].rotation.x = swing;
    player.userData.legs[1].rotation.x = -swing;

    trailSpawnTimer -= dt;
    if(trailSpawnTimer <= 0) {
      trailSpawnTimer = 0.05;
      spawnTrail(player.position.x, player.position.y + 0.5, player.position.z, 0x7dffb0);
    }
  } else {
    player.userData.legs[0].rotation.x *= 0.8;
    player.userData.legs[1].rotation.x *= 0.8;
  }

  player.position.x = Math.max(-CFG.PATH_HALF + 1, Math.min(CFG.PATH_HALF - 1, player.position.x));
  for(const g of gateObjects){
    if(!unlocked[g.index] && player.position.z < g.z + 2) player.position.z = g.z + 2;
  }

  const targetX = player.position.x, targetY = player.position.y + 2, targetZ = player.position.z;
  const offsetX = Math.sin(camYaw) * Math.cos(camPitch) * camDist;
  const offsetY = Math.sin(camPitch) * camDist;
  const offsetZ = Math.cos(camYaw) * Math.cos(camPitch) * camDist;
  camPos.set(targetX + offsetX, targetY + offsetY, targetZ + offsetZ);
  camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
  camera.lookAt(targetX, targetY, targetZ);

  // Анимация пета (прыгает при движении)
  if(equippedPetId && petFollowerMesh) {
    const offsetX = Math.cos(player.rotation.y) * 2;
    const offsetZ = -Math.sin(player.rotation.y) * 2;
    const targetPetX = player.position.x + offsetX;
    const targetPetZ = player.position.z + offsetZ;
    
    const bobHeight = moving ? Math.abs(Math.sin(elapsed * 10)) * 0.8 : 0;
    const targetPetY = player.position.y + 2.5 + bobHeight;
    
    petFollower.position.lerp(new THREE.Vector3(targetPetX, targetPetY, targetPetZ), 1 - Math.pow(0.005, dt));
    petFollower.rotation.y = player.rotation.y;
  }

  // БЕГОВАЯ ДОРОЖКА
  let onTreadmill = false;
  for(const tm of treadmills) {
    const d = Math.hypot(player.position.x - tm.x, player.position.z - tm.z);
    if(d < 3) {
      onTreadmill = true;
      tm.roller1.rotation.x += dt * 10;
      tm.roller2.rotation.x += dt * 10;
      tm.beltGroup.children.forEach((strip) => {
        strip.position.z += dt * 5;
        if(strip.position.z > 2.8) strip.position.z = -2.8;
      });
      treadmillSpeedStat += dt * 15;
      if(treadmillAlertTimer <= 0) {
        showToast(`Дорожка: +${Math.floor(treadmillSpeedStat)} Speed`, 'good');
        treadmillAlertTimer = 3.0;
      }
    }
  }
  if(treadmillAlertTimer > 0) treadmillAlertTimer -= dt;

  let nearInc = false;
  for(const inc of incubators) {
    if(Math.hypot(player.position.x - inc.x, player.position.z - inc.z) < 4) nearInc = true;
  }
  if(nearInc && !shopOpen && hatchUI.classList.contains('hidden') && !onTreadmill) {
    interactPrompt.classList.add('show');
  } else {
    interactPrompt.classList.remove('show');
  }

  updateChests(dt);

  // МАГНИТ И ОРБЫ
  const magnetRadius = magnetLevel > 0 ? MAGNET_UPGRADES[magnetLevel-1].radius : 0;
  
  for(const orb of orbObjects){
    if(!orb.active){
      orb.timer -= dt;
      if(orb.timer <= 0){ orb.active = true; orb.mesh.visible = true; }
      continue;
    }
    orb.mesh.position.y = orb.baseY + Math.sin(elapsed*3 + orb.x) * 0.3;
    orb.mesh.rotation.y += dt * 2;

    const d = Math.hypot(player.position.x - orb.x, player.position.z - orb.z);
    
    // Притяжение магнитом
    if(d < magnetRadius && orb.active) {
      orb.mesh.position.x -= (orb.mesh.position.x - player.position.x) * dt * 5;
      orb.mesh.position.z -= (orb.mesh.position.z - player.position.z) * dt * 5;
      orb.x = orb.mesh.position.x;
      orb.z = orb.mesh.position.z;
    }

    if(d < 2.5 && baseAt(player.position.z) !== -1){
      if(orb.type === 'speed'){
        speedBonus = Math.min(CFG.MAX_ORB_BONUS, speedBonus + CFG.ORB_BONUS);
        updateHUD();
      } else {
        let r = 100 * (1 + Math.floor(Math.random()*5)) * getMoneyMult();
        coins += r; updateHUD(); showToast('+$'+fmt(r), 'good');
      }
      orb.active = false; orb.mesh.visible = false; orb.timer = 5;
      // Возврат на базу
      orb.mesh.position.x = orb.x; orb.mesh.position.z = orb.z;
    }
  }

  // Яйца и Монстры
  for(const b of biomeObjects){
    if(b.eggVisible){
      b.eggMesh.position.y = 2 + Math.sin(elapsed*2 + b.index) * 0.1;
      b.eggMesh.rotation.y += dt;
      const d = Math.hypot(player.position.x, player.position.z - b.nestZ);
      
      if(d < 3.5 && !carrying && biomeAt(player.position.z) === b.index){
        if(getDisplaySpeed() >= b.def.stealReq) {
          b.eggVisible = false; b.eggG.visible = false;
          carrying = true; b.chasing = true; b.returning = false; activeChase = b;
          showToast('ЯЙЦО УКРАДЕНО!', 'bad');
        } else {
          if(!b.warnedThisSecond) {
            showToast(`Мало скорости! Нужно: ${fmt(b.def.stealReq)}`, 'bad');
            b.warnedThisSecond = true;
            setTimeout(() => b.warnedThisSecond = false, 2000);
          }
        }
      }
    } else if(!b.chasing && !b.returning) {
      b.respawnTimer = (b.respawnTimer || 0) + dt;
      if(b.respawnTimer > 5) {
        b.respawnTimer = 0;
        b.eggVisible = true; b.eggG.visible = true;
      }
    }

    if(b.chasing){
      const tx = player.position.x - b.monster.position.x;
      const tz = player.position.z - b.monster.position.z;
      const dist = Math.hypot(tx, tz);
      const mSpd = b.def.monsterSpeed;
      if(dist > 0.1){
        b.monster.position.x += (tx/dist) * mSpd * dt;
        b.monster.position.z += (tz/dist) * mSpd * dt;
        b.monster.rotation.y = Math.atan2(tx, tz);
      }
      b.monster.userData.arms[0].rotation.x = Math.sin(elapsed*15)*1.5;
      b.monster.userData.arms[1].rotation.x = -Math.sin(elapsed*15)*1.5;
      
      if(dist < 3) {
        b.chasing = false; b.returning = true; activeChase = null; carrying = false;
        speedBonus = 0; b.eggVisible = true; b.eggG.visible = true;
        showToast('ТЕБЯ ПОЙМАЛИ!', 'bad'); updateHUD();
      }
      
      if(baseAt(player.position.z) !== -1) {
        let reward = b.def.reward * getMoneyMult();
        coins += reward;
        eggInventory[b.index] = (eggInventory[b.index] || 0) + 1;

        b.chasing = false; b.returning = true; activeChase = null; carrying = false;
        speedBonus = 0; b.eggVisible = false; b.eggG.visible = false; b.respawnTimer = 0;
        
        showToast(`+$${fmt(reward)} и ${b.def.eggName}!`, 'good');
        updateHUD();
      }
    } else if(b.returning){
      const dx = 0 - b.monster.position.x;
      const dz = b.monsterHome.z - b.monster.position.z;
      const d = Math.hypot(dx, dz);
      if(d < 1){
        b.monster.position.copy(b.monsterHome); b.returning = false;
      } else {
        b.monster.position.x += (dx/d) * 15 * dt;
        b.monster.position.z += (dz/d) * 15 * dt;
        b.monster.rotation.y = Math.atan2(dx, dz);
      }
    } else {
      b.monster.position.y = Math.sin(elapsed*2 + b.index) * 0.2;
    }
  }

  const cb = baseAt(player.position.z);
  const cr = biomeAt(player.position.z);
  const zName = document.getElementById('zonename');
  const zStat = document.getElementById('status');
  
  if(cb !== -1){
    zName.textContent = '🏠 ' + BIOMES[cb].name + ' — SAFE ZONE';
    zStat.textContent = 'Стат скорости: ' + fmt(getDisplaySpeed());
    zStat.classList.remove('warn');
  } else if(cr !== -1){
    zName.textContent = BIOMES[cr].name;
    if(carrying){
      zStat.textContent = 'БЕГИ НА БАЗУ!';
      zStat.classList.add('warn');
    } else {
      zStat.textContent = `Стат: ${fmt(getDisplaySpeed())} / Нужно: ${fmt(BIOMES[cr].stealReq)}`;
      zStat.classList.remove('warn');
    }
  }

  const rel = (Z_TOP - player.position.z) / Z_TOTAL;
  document.getElementById('mm-marker').style.top = `calc(${Math.max(0, Math.min(1, rel)) * 100}% - 2px)`;

  if(toastTimer > 0){
    toastTimer -= dt;
    if(toastTimer <= 0) document.getElementById('toast').className = '';
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

updateHUD();
animate();
</script>
</body>
</html>
